#===============================================================================
#
#   Horizon Shaders  -  block material ids
#
#   As soon as this file exists Iris stops using its built in legacy id map
#   (IdMap: `blockPropertiesMap == null` is the only path that calls
#   LegacyIdMap.addLegacyValues), so every id the pack's GLSL compares against has
#   to be defined here. The ids are pack defined: lib/material.glsl repeats the
#   same numbers as HZ_BLOCK_* constants and compares them with a float equality,
#   so the numbers in both files have to agree exactly.
#
#   mc_Entity.x carries the id for the TERRAIN and MOVING_BLOCK render types
#   (gbuffers_terrain, gbuffers_water, gbuffers_block). Every other program sees
#   -1.0, which lib/material.glsl calls HZ_BLOCK_NONE.
#
#   Entries are separated by whitespace, and each entry is either `namespace:path`,
#   `namespace:path:property=value` for a block state filter, or `%namespace:tag`
#   for a block tag filter (BlockEntry#parse). Each value is kept on a single
#   line: Iris trims every line of a properties file before parsing it
#   (PropertiesPreprocessor#process), and a backslash continuation adds nothing
#   here but risk.
#
#===============================================================================

# 9 = water. gbuffers_water writes its refraction/reflection material buffer only
# for this id, and the deferred pass is what resolves it. Lava and ice get their
# own ids precisely so that they never end up inside that buffer.
block.9=minecraft:water

# 11 = lava. Rendered as a bright emissive surface, and excluded from the water
# material buffer by the non water branch of gbuffers_water.
block.11=minecraft:lava

# 79 = ice. Solid looking, but still drawn as a translucent block, so
# gbuffers_water has to recognise it and leave the material buffer empty.
block.79=minecraft:ice minecraft:packed_ice minecraft:blue_ice minecraft:frosted_ice

# 100 = molten or burning solids. Self lit and unaffected by the lightmap, so
# that fire and hot stone keep reading as hot at any time of day.
block.100=minecraft:magma_block minecraft:lava_cauldron minecraft:fire minecraft:soul_fire minecraft:campfire:lit=true minecraft:soul_campfire:lit=true minecraft:furnace:lit=true minecraft:blast_furnace:lit=true minecraft:smoker:lit=true

# 101 = lamps. Strong emissive: a light source should look like the origin of
# light rather than like a surface that the lightmap happens to brighten.
block.101=minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight minecraft:redstone_lamp:lit=true minecraft:jack_o_lantern minecraft:lantern minecraft:soul_lantern minecraft:ochre_froglight minecraft:verdant_froglight minecraft:pearlescent_froglight minecraft:end_rod minecraft:beacon minecraft:copper_bulb:lit=true

# 102 = small flames. A little dimmer than a lamp body so that a torch flame does
# not blow out the whole block it sits on. The candle tag covers every dye
# variant; `lit=true` keeps unlit candles out.
block.102=minecraft:torch minecraft:soul_torch minecraft:redstone_torch %minecraft:candles:lit=true
