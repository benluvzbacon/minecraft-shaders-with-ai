#===============================================================================
#
#   Horizon Shaders  -  pack properties
#
#   Every key in this file is one that Iris actually parses
#   (net.irisshaders.iris.shaderpack.properties.ShaderProperties). Unknown keys
#   are reported as errors in the log, so nothing experimental lives here.
#
#   Two parsing details of ShaderProperties matter for how this file is written:
#
#     * The file is run through Iris' C preprocessor with the pack options
#       defined as macros (PropertiesPreprocessor#preprocessSource), so #ifdef
#       blocks work here. A boolean option is defined as an empty macro when it
#       is enabled and is left as a bare identifier when it is not, which is why
#       `program.<name>.enabled=OPTION` ends up as an empty expression (which
#       BooleanParser answers with "true") while the option is on, and as
#       "OPTION" (which resolves to false) while it is off.
#
#     * `sliders`, `profile.*` and the `screen*` keys are read from the
#       *original*, unpreprocessed file, so option names in those lines are safe
#       from macro expansion.
#
#===============================================================================

#--- sky -----------------------------------------------------------------------
# gbuffers_skybasic renders the entire sky procedurally: gradient, sun disc and
# glow, moon with the real lunar phase, stars and the shader cloud layer. The
# vanilla counterparts are therefore switched off, while `sky` stays enabled
# because the sky quad is the geometry that program shades.
sky=true
sun=false
moon=false
stars=false
clouds=off
vignette=false
underwaterOverlay=false

#--- lighting ------------------------------------------------------------------
# Vanilla directional shading would be multiplied on top of the pack's own
# NdotL term. Ambient occlusion has to stay inside the vertex colour, because
# that is where the lighting model reads it from.
oldLighting=false
separateAo=false

#--- shadows -------------------------------------------------------------------
# shadow.enabled=false makes Iris skip the whole shadow pass
# (IrisRenderingPipeline only builds a ShadowRenderer when it is not false), and
# lib/shadows.glsl stops sampling shadowtex0 as well, so no shadow map is ever
# allocated or drawn. The shadow programs stay in the pack in that case, which
# keeps shadowtex0 / shadowcolor0 bound for the other programs.
#ifdef SHADOWS
shadow.enabled=true
#else
shadow.enabled=false
#endif
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

# Rain and snow keep the vanilla behaviour of not writing depth. gbuffers_weather
# only applies fog to them, and a depth write would let a rain quad hide the water
# surface from the deferred water pass, which compares the surface depth against
# depthtex0 to decide whether a pixel still belongs to the water.
rain.depth=false

#--- conditional programs ------------------------------------------------------
# A disabled program is removed from the program set entirely
# (ShaderPack#sourceProvider returns null), so a pass that is not needed costs
# nothing instead of running as a copy. The program bodies carry the same
# conditions as #ifdef guards, so the output is identical either way.
program.composite.enabled=BLOOM
program.composite1.enabled=BLOOM
program.composite2.enabled=BLOOM
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=TEMPORAL_SMOOTHING

#--- sliders -------------------------------------------------------------------
# Numeric options. The mode and quality options are deliberately left out, they
# read better as a button that cycles through labelled values.
sliders=SHADOW_RESOLUTION SHADOW_DISTANCE SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_BIAS SHADOW_DISTORTION SUN_PATH_TILT SUNLIGHT_STRENGTH MOONLIGHT_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH BLOCKLIGHT_FALLOFF CLOUD_DENSITY CLOUD_ALTITUDE CLOUD_SPEED STAR_DENSITY ATMOSPHERE_STRENGTH UNDERWATER_DENSITY WATER_WAVE_STRENGTH WATER_ABSORPTION WATER_TURBIDITY WATER_SHININESS WATER_F0 BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION CONTRAST GAMMA VIGNETTE_STRENGTH TEMPORAL_STRENGTH

#--- profiles ------------------------------------------------------------------
# A profile matches when every option it lists has the listed value, and choosing
# one in the menu writes all of them. The shipped defaults match MEDIUM.
profile.LOW=!SHADOWS !SOFT_SHADOWS !COLORED_SHADOWS CLOUD_QUALITY=0 WATER_QUALITY=0 !WATER_REFRACTION !WATER_REFLECTION !WATER_FOAM !CAVE_ADAPT !BLOOM BLOOM_QUALITY=0 !TEMPORAL_SMOOTHING !COLOR_GRADING !VIGNETTE
profile.MEDIUM=SHADOWS SOFT_SHADOWS COLORED_SHADOWS SHADOW_RESOLUTION=2048 SHADOW_DISTANCE=128.0 SHADOW_SOFTNESS=1.0 SHADOW_SAMPLES=12 CLOUD_QUALITY=1 WATER_QUALITY=1 WATER_REFRACTION WATER_REFLECTION WATER_FOAM CAVE_ADAPT BLOOM BLOOM_QUALITY=1 !TEMPORAL_SMOOTHING !COLOR_GRADING VIGNETTE
profile.HIGH=SHADOWS SOFT_SHADOWS COLORED_SHADOWS SHADOW_RESOLUTION=4096 SHADOW_DISTANCE=256.0 SHADOW_SOFTNESS=1.5 SHADOW_SAMPLES=16 CLOUD_QUALITY=2 WATER_QUALITY=2 WATER_REFRACTION WATER_REFLECTION WATER_FOAM CAVE_ADAPT BLOOM BLOOM_QUALITY=2 TEMPORAL_SMOOTHING !COLOR_GRADING VIGNETTE

#--- settings menu -------------------------------------------------------------
screen.columns=2
screen=<profile> [LIGHTING_SCREEN] [SHADOW_SCREEN] [WATER_SCREEN] [ATMOSPHERE_SCREEN] [CLOUD_SCREEN] [POST_SCREEN] WAVING_FOLIAGE <empty> *

screen.LIGHTING_SCREEN=SUNLIGHT_STRENGTH MOONLIGHT_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH BLOCKLIGHT_FALLOFF HAND_LIGHT CAVE_ADAPT
screen.SHADOW_SCREEN=SHADOWS SOFT_SHADOWS COLORED_SHADOWS SHADOW_RESOLUTION SHADOW_DISTANCE SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_BIAS SHADOW_DISTORTION
screen.WATER_SCREEN=WATER_QUALITY WATER_WAVES WATER_WAVE_STRENGTH WATER_REFRACTION WATER_REFLECTION WATER_FOAM WATER_ABSORPTION WATER_TURBIDITY WATER_SHININESS WATER_F0
screen.ATMOSPHERE_SCREEN=ATMOSPHERE_STRENGTH UNDERWATER_DENSITY STARS STAR_DENSITY SUN_PATH_TILT
screen.CLOUD_SCREEN=CLOUDS CLOUD_SHADOWS CLOUD_QUALITY CLOUD_DENSITY CLOUD_ALTITUDE CLOUD_SPEED
screen.POST_SCREEN=BLOOM BLOOM_QUALITY BLOOM_STRENGTH BLOOM_THRESHOLD TONEMAP_MODE EXPOSURE SATURATION CONTRAST GAMMA VIGNETTE VIGNETTE_STRENGTH COLOR_GRADING TEMPORAL_SMOOTHING TEMPORAL_STRENGTH DITHERING
